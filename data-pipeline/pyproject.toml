[project]
name = "taxi-revenue-pipeline"
version = "0.1.0"
description = "ELT pipeline: NYC Green Taxi trip data -> DuckDB -> daily revenue"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "prefect>=3.8.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
